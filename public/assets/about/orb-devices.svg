<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Software jeder Art: Laptop mit App-Fenstern und daneben ein Handy -->
  <defs>
    <mask id="phone-gap">
      <rect width="320" height="320" fill="#fff" />
      <rect x="196" y="122" width="96" height="164" rx="18" fill="#000" />
    </mask>
  </defs>
  <g fill="#ffdf83">
    <g mask="url(#phone-gap)">
      <!-- Bildschirm (Rahmen) mit zwei App-Kacheln -->
      <path fill-rule="evenodd" d="M58 70 H246 a14 14 0 0 1 14 14 V214 H44 V84 a14 14 0 0 1 14 -14 Z M64 90 V196 H240 V90 Z" />
      <rect x="78" y="104" width="70" height="40" rx="6" />
