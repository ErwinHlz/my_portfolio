      <rect x="160" y="104" width="64" height="40" rx="6" opacity="0.75" />
      <!-- Unterteil -->
      <path d="M20 224 H284 L 270 246 H34 Z" />
    </g>
    <!-- Handy -->
    <path fill-rule="evenodd" d="M218 132 H272 a12 12 0 0 1 12 12 V264 a12 12 0 0 1 -12 12 H218 a12 12 0 0 1 -12 -12 V144 a12 12 0 0 1 12 -12 Z M218 150 V252 H272 V150 Z" />
    <rect x="226" y="160" width="38" height="22" rx="4" />
    <rect x="226" y="190" width="38" height="12" rx="3" opacity="0.75" />
    <rect x="226" y="208" width="26" height="12" rx="3" opacity="0.75" />
    <circle cx="245" cy="264" r="4.5" fill="#1a120a" />
  </g>
</svg>
